<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fa">
  <meta name="description" content="Минималистичный голосовой переводчик для разговора в поездках.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Переводчик">
  <title>Переводчик</title>
  <link rel="manifest" href="manifest.webmanifest?v=12">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
  <main class="app">
    <section class="country-row" aria-label="Выбор страны">
      <select id="countrySelect" aria-label="Страна собеседника"></select>
    </section>

    <section class="talk-card">
      <div class="card-head">
        <strong>Вы</strong>
        <span id="youDirection">Русский → English</span>
      </div>
      <div class="input-box">
        <textarea id="youText" rows="3" placeholder="Скажите или напишите по-русски"></textarea>
        <div class="input-actions">
          <button id="youMic" class="icon-btn mic" type="button" aria-label="Говорить по-русски" title="Говорить">🎤</button>
          <button id="youSend" class="icon-btn send" type="button" aria-label="Перевести" title="Перевести">➜</button>
        </div>
      </div>
      <div id="youResult" class="result" hidden>
        <div id="foreignText" class="result-text"></div>
        <button id="speakForeign" class="sound-btn" type="button" aria-label="Озвучить перевод">🔊</button>
      </div>
    </section>

    <div class="swap-mark" aria-hidden="true">↕</div>

    <section class="talk-card partner-card">
      <div class="card-head">
        <strong>Собеседник</strong>
        <span id="partnerDirection">English → Русский</span>
      </div>
      <div class="input-box">
        <textarea id="partnerText" rows="3" placeholder="Say or type in English"></textarea>
        <div class="input-actions">
          <button id="partnerMic" class="icon-btn mic" type="button" aria-label="Говорить на языке собеседника" title="Говорить">🎤</button>
          <button id="partnerSend" class="icon-btn send" type="button" aria-label="Перевести на русский" title="Перевести">➜</button>
        </div>
      </div>
      <div id="partnerResult" class="result" hidden>
        <div id="russianText" class="result-text"></div>
        <button id="speakRussian" class="sound-btn" type="button" aria-label="Озвучить по-русски">🔊</button>
      </div>
    </section>

    <div id="toast" class="toast" hidden></div>
  </main>

  <script src="app.js?v=12" defer></script>
</body>
</html>
